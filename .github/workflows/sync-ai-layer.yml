name: Sync Open Field AI layer

on:
  push:
    branches: [main]
    paths:
      - "data/days.json"
      - "data/affiliates.json"
      - "scripts/sync-ai-layer.py"
  pull_request:
    paths:
      - "data/days.json"
      - "data/affiliates.json"
      - "scripts/sync-ai-layer.py"
      - "index.html"
      - "about.html"
      - "data/field-snapshot.md"

permissions:
  contents: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so push back to main works after auto-heal
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate AI layers from days.json
        run: python3 scripts/sync-ai-layer.py
      - name: Registry + derived-layer check
        run: python3 scripts/sync-ai-layer.py --check
      - name: Fail PR if derived layers were stale
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --exit-code -- index.html about.html data/field-snapshot.md; then
            echo "::error::AI layers out of sync with data/days.json. Run: python3 scripts/sync-ai-layer.py"
            git status --short
            exit 1
          fi
      - name: Auto-heal derived layers on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- index.html about.html data/field-snapshot.md; then
            echo "Derived layers already in sync."
            exit 0
          fi
          git config user.name "openfield-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html data/field-snapshot.md
          git commit -m "chore(sync): regenerate AI layers from days.json"
          git push
